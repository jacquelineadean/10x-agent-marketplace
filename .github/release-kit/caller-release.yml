# Copy to .github/workflows/release.yml in each consuming repo.
name: Release

on:
  push:
    branches:
      - main
      - "release/**" # hotfix lines, e.g. release/1.4.x

permissions: {}

concurrency:
  # Two pushes in a row must not race on the same release PR; never cancel a tagging run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pin to a full commit SHA of the shared repo; a tag can move.
    uses: jacquelineadean/10x-agent-marketplace/.github/workflows/release-please.yml@SHA_OF_THE_SHARED_REPO
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      # Optional GitHub App. Without one, set RELEASE_TOKEN or fall back to GITHUB_TOKEN.
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      token: ${{ secrets.RELEASE_TOKEN }}

  publish:
    needs: release
    # Single-package repos read release_created; multi-package repos read releases_created
    # and pick each package's tag from fromJSON(needs.release.outputs.all).
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment holds the registry credentials and can require a reviewer.
    environment:
      name: production
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC to the registry and build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      # Replace with your stack's build and publish steps; README.md lists them per stack.
      - name: Build and publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: echo "Publishing $VERSION"
