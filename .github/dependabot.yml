# Weekly update PRs, grouped so each ecosystem opens at most one PR a week.
# Prefixes keep titles Conventional: dev tools and actions never cut a plugin release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new action version waits 14 days before it is offered.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # Every package in uv.lock is a dev tool; plugins use the standard library at runtime.
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tools:
        patterns: ["*"]
