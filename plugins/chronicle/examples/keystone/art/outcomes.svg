    <rect x="1170" y="290" width="300" height="380" fill="#fdfaf2" data-shade="0.2"/>
    <rect x="1170" y="290" width="300" height="56" fill="#b5652b"/>
    <path d="M1194 400 L1440 400 M1194 440 L1400 440 M1194 480 L1420 480 M1194 520 L1380 520" fill="none" stroke="#8d857b" stroke-width="1.2" data-line="pencil"/>
    <path d="M1300 560 L1446 560 L1446 610 L1300 610 Z" fill="none" stroke-width="2"/>
  </g>
  <g stroke="#2b231d" stroke-width="2.4">
    <path d="M1270 262 L1350 256 L1356 300 L1276 306 Z" fill="#2b231d"/>
    <path d="M1286 262 C1280 220 1300 210 1312 236 M1340 258 C1340 214 1360 210 1366 240" fill="none" stroke="#8b9593" stroke-width="4"/>
  </g>
  <text x="1318" y="333" font-size="22" text-anchor="middle" data-label="label" fill="#fdfaf2" transform="rotate(-5 1320 480)">Monolith + cloud</text>
  <text x="1372" y="597" font-size="22" text-anchor="middle" data-label="number" fill="#2b231d" transform="rotate(-5 1320 480)">{{cost.monthly_now}}</text>
  <text x="1238" y="600" font-size="18" data-label="label" fill="#6b6a68" transform="rotate(-5 1320 480)">Total</text>
  <text x="1478" y="350" font-size="18" text-anchor="end" data-label="label" fill="#6b6a68" transform="rotate(6 1330 470)">Cloud</text>
  <circle cx="950" cy="420" r="1" fill="none" stroke="none" data-anchor="stopwatch"/>
  <circle cx="1320" cy="470" r="1" fill="none" stroke="none" data-anchor="bills"/>
