      <rect x="312" y="586" width="34" height="24" rx="4"/><rect x="356" y="588" width="34" height="24" rx="4"/><rect x="400" y="590" width="34" height="24" rx="4"/>
      <rect x="306" y="624" width="34" height="24" rx="4"/><rect x="350" y="626" width="34" height="24" rx="4"/><rect x="394" y="628" width="34" height="24" rx="4" fill="#2f6b4f"/>
    </g>
    <circle cx="392" cy="450" r="26" fill="#2f6b4f"/>
    <path d="M378 450 L389 462 L408 436" fill="none" stroke="#ffffff" stroke-width="5" data-line="lift"/>
  </g>
  <text x="392" y="500" font-size="17" text-anchor="middle" data-label="label" fill="#2f6b4f">Approved</text>
  <!-- receipt printer: a short receipt, torn off, standing out of the slot -->
  <path d="M590 652 L840 646 L860 620 L610 626 Z" fill="#4a3f33" fill-opacity="0.35" data-paint="glaze" data-wet="0.6" stroke="none"/>
  <g stroke="#2b231d" stroke-width="2.4">
    <path d="M656 532 L654 400 L668 392 L682 400 L696 392 L710 400 L724 392 L738 400 L752 392 L766 400 L768 532 Z" fill="#fdfaf2" data-shade="0.25"/>
    <path d="M600 640 L600 548 C600 536 610 528 622 528 L800 528 C812 528 822 536 822 548 L822 640 Z" fill="#3e4a57" data-shade="0.55"/>
    <path d="M640 540 L784 540 L784 552 L640 552 Z" fill="#1d232a"/>
    <circle cx="796" cy="610" r="7" fill="#5f8a2e" stroke-width="1.6"/>
    <rect x="626" y="600" width="60" height="16" rx="4" fill="#8b9593" stroke-width="1.6"/>
  </g>
  <g fill="none" stroke="#8d857b" stroke-width="1.3" data-line="pencil">
    <path d="M672 424 L748 422 M672 446 L720 445 M672 468 L752 466 M672 490 L736 489 M672 512 L700 511 M716 511 L750 510"/>
  </g>
