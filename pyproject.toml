[project]
name = "agent-marketplace-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = [
    "plugins/impact-review/tests",
    "packages/chronicle-engine/tests",
    "packages/sources/tests",
    "plugins/chronicle/tests",
    "plugins/sources/tests",
    "plugins/briefing/tests",
    "plugins/speedup/tests",
]
pythonpath = [
    "plugins/impact-review/src",
    "packages/chronicle-engine/src",
    "packages/sources/src",
    "plugins/chronicle/src",
    "plugins/briefing/src",
    "plugins/speedup/src",
]
