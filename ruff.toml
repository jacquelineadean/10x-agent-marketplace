# GroundWork standard Python lint and format rules (STANDARD.md §5i). Change a rule only on purpose, with a reason.
line-length = 100

[lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes: real errors
  "I",             # import order
  "N",             # naming
  "UP",            # modern syntax
  "B",             # likely bugs
  "S",             # security (bandit): shell=True, SQL built from strings, hardcoded passwords
  "BLE",           # no blind `except Exception`
  "T20",           # no print() outside entry points
  "ERA",           # no commented-out code
  "RET", "SIM", "C4", "PIE",  # simpler code
  "PTH",           # pathlib over os.path
  "PGH",           # no blanket `# noqa` / `# type: ignore`
]

[lint.per-file-ignores]
"tests/**" = ["S101", "T20"]
"**/test_*.py" = ["S101", "T20"]
"**/entrypoints/**" = ["T20"]
"**/cli/**" = ["T20"]

[format]
