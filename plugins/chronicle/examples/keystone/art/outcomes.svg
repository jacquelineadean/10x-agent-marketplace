  <text x="950" y="480" font-size="30" text-anchor="middle" data-label="number" fill="#2b231d">{{experience.p95_now}}</text>
  <text x="950" y="506" font-size="17" text-anchor="middle" data-label="label" fill="#6b6a68">Checkout p95</text>
