# Checks the PR title and branch name against CONTRIBUTING.md. PRs are squash-merged with
# the title as the commit message, so the title is what release-please reads.
name: PR lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          # One scope per plugin, plus repo-wide areas. A new plugin adds its name here.
          scopes: |
            impact-review
            chronicle
            speedup
            marketplace
            groundwork
            deps
            release
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start lower case and not end with a period.
            Example: "feat(chronicle): add a timeline block".
          wip: true

  branch:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the head branch against the naming patterns
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          patterns=(
            '^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore)/[a-z0-9][a-z0-9._-]*$'
            '^release/([a-z0-9-]+-)?[0-9]+\.[0-9]+\.x$'
            '^release-please--.+$'
            '^dependabot/.+$'
            '^claude/[a-z0-9._-]+$'
          )
          for pattern in "${patterns[@]}"; do
            if [[ "$BRANCH" =~ $pattern ]]; then
              echo "Branch '$BRANCH' matches $pattern"
              exit 0
            fi
          done
          echo "::error::Branch '$BRANCH' does not match a pattern in CONTRIBUTING.md, e.g. feat/chronicle-timeline-block or fix/123-token-leak."
          exit 1
