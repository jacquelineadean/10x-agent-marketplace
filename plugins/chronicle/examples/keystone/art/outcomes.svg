<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1600 610">
  <!-- a shop counter: the checkout got fast, the bills have not shrunk yet -->
  <path d="M-20 30 C500 60 1100 20 1620 40 L1620 520 L-20 530 Z" fill="#d6dbd2" fill-opacity="0.75" data-paint="wet" data-shade="0" stroke="none"/>
