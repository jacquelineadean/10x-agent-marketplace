<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- the keeper's house from the lawn: pink stucco, a green door, the lamp lit at dusk -->
  <rect x="-20" y="-20" width="1640" height="640" fill="#e7dfcb" data-paint="wet" data-shade="0" stroke="none"/>
  <path d="M-20 640 C 400 620 1200 650 1620 630 L1620 920 L-20 920 Z" fill="#9aab68" stroke="none" data-shade="0.3"/>
  <!-- oaks either side -->
  <g stroke="#2b231d" stroke-width="2.2">
    <rect x="130" y="380" width="44" height="280" fill="#5b4532"/>
    <circle cx="150" cy="330" r="150" fill="#56713f" data-shade="0.5"/>
    <rect x="1420" y="400" width="40" height="260" fill="#5b4532"/>
    <circle cx="1440" cy="350" r="140" fill="#56713f" data-shade="0.5"/>
  </g>
  <!-- the house -->
  <g stroke="#2b231d" stroke-width="2.8">
    <rect x="400" y="300" width="800" height="360" fill="#e3b3a2" data-shade="0.45"/>
    <path d="M370 304 L800 120 L1230 304 Z" fill="#8a4b3a" data-shade="0.4" data-anchor="roof"/>
    <rect x="740" y="470" width="120" height="190" fill="#3f6250" data-shade="0.3" data-anchor="door"/>
    <rect x="480" y="380" width="140" height="150" fill="#5f7f8a"/>
    <rect x="980" y="380" width="140" height="150" fill="#5f7f8a"/>
    <path d="M550 380 L550 530 M480 455 L620 455 M1050 380 L1050 530 M980 455 L1120 455" fill="none" stroke-width="3"/>
    <path d="M700 660 L900 660 L920 700 L680 700 Z" fill="#c8bba0"/>
  </g>
  <!-- the lamp by the door -->
  <g stroke="#2b231d" stroke-width="2">
    <rect x="890" y="470" width="26" height="40" fill="#f2c46b" data-anchor="lamp"/>
    <path d="M884 470 L922 470 L903 452 Z" fill="#3a3028"/>
  </g>
  <circle cx="800" cy="690" r="5" data-anchor="steps" data-paint="none" data-line="none"/>
  <circle cx="300" cy="760" r="5" data-anchor="lawn" data-paint="none" data-line="none"/>
</svg>
