    <path d="M1010 270 L1040 240" fill="none" stroke-width="10" stroke="#8b9593"/>
    <circle cx="950" cy="420" r="138" fill="#b8c0bd" data-shade="0.55"/>
    <circle cx="950" cy="420" r="116" fill="#fbf7ea" data-shade="0.15"/>
    <path d="M950 420 L1010 330" fill="none" stroke="#c23a2c" stroke-width="4.5"/>
    <circle cx="950" cy="420" r="9" fill="#2b231d"/>
    <path d="M950 312 L950 330 M1058 420 L1040 420 M950 528 L950 510 M842 420 L860 420" fill="none" stroke-width="3"/>
