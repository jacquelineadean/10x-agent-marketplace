<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- the north dock at low water: the pier, the ferry tied up, the tide line on the pilings -->
  <rect x="-20" y="-20" width="1640" height="520" fill="#dfe6df" data-paint="wet" data-shade="0" stroke="none"/>
  <path d="M-20 430 C 300 410 700 440 1000 420 C 1300 400 1500 430 1620 420 L1620 920 L-20 920 Z" fill="#8fb0ae" data-paint="wet" data-shade="0.2" stroke="none"/>
  <path d="M-20 300 C 200 260 420 280 560 330 L560 440 L-20 440 Z" fill="#7d8f5c" stroke="#2b231d" stroke-width="2" data-shade="0.4"/>
  <!-- pilings with the high-water line -->
  <g stroke="#2b231d" stroke-width="2.6">
    <rect x="640" y="380" width="34" height="420" fill="#6e5038" data-shade="0.5"/>
    <rect x="900" y="380" width="34" height="420" fill="#6e5038" data-shade="0.5"/>
    <rect x="1160" y="380" width="34" height="420" fill="#6e5038" data-shade="0.5"/>
    <rect x="1420" y="380" width="34" height="420" fill="#6e5038" data-shade="0.5"/>
  </g>
  <path d="M640 560 L1454 560" stroke="#3c4a3f" stroke-width="5" fill="none" data-line="pencil"/>
  <circle cx="917" cy="560" r="6" data-anchor="tideline" data-paint="none" data-line="none"/>
  <!-- the pier deck -->
  <path d="M520 360 L1600 352 L1600 400 L520 410 Z" fill="#a98a62" stroke="#2b231d" stroke-width="2.6" data-shade="0.3"/>
  <!-- the ferry -->
  <g stroke="#2b231d" stroke-width="2.6">
    <path d="M760 520 L1300 520 L1250 640 L820 640 Z" fill="#f1ece0" data-shade="0.3"/>
    <rect x="900" y="440" width="220" height="80" fill="#d8cdb6" data-shade="0.3"/>
    <rect x="930" y="460" width="40" height="30" fill="#4f6f7a"/>
    <rect x="1000" y="460" width="40" height="30" fill="#4f6f7a"/>
    <rect x="1070" y="460" width="30" height="30" fill="#4f6f7a"/>
  </g>
  <!-- the sign at the head of the pier -->
  <g stroke="#2b231d" stroke-width="2.4">
    <rect x="560" y="200" width="12" height="170" fill="#6e5038"/>
    <rect x="470" y="180" width="200" height="80" fill="#f4efe3" data-anchor="sign"/>
  </g>
  <text x="570" y="232" font-size="26" data-label="label" text-anchor="middle" fill="#23302a">No wake</text>
  <text x="570" y="252" font-size="16" data-label="label" text-anchor="middle" fill="#23302a">Marrow Key landing</text>
</svg>
