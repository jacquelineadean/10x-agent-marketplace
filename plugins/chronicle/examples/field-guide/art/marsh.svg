<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1000">
  <!-- Marrow Key from the salt marsh to the surf: cordgrass and the creek, the mudflat the
       tide covers twice a day, the dunes, the beach and the sea behind them -->
  <rect x="-20" y="-20" width="3240" height="620" fill="#e3e7dc" data-paint="wet" data-shade="0" stroke="none"/>
  <!-- the sea behind the dunes -->
  <path d="M2420 560 C 2600 550 2900 556 3220 540 L3220 680 L2420 680 Z" fill="#86aeb3" stroke="none" data-paint="wet" data-shade="0.2"/>
  <!-- the hammock of live oaks behind the marsh -->
  <path d="M-20 560 C 60 470 140 500 200 450 C 280 400 360 470 420 430 C 500 380 560 460 640 420 C 720 380 800 460 880 430 C 960 400 1040 470 1120 450 C 1220 430 1320 500 1480 600 L-20 600 Z" fill="#55703f" stroke="#2b231d" stroke-width="2.4" data-shade="0.45"/>
  <!-- the mudflat -->
  <path d="M1300 600 C 1500 640 1800 626 2000 640 C 2200 652 2320 620 2440 612 L2440 1020 L1300 1020 Z" fill="#a89b84" stroke="none" data-shade="0.25"/>
  <g fill="#8a7e68" stroke="none">
    <ellipse cx="1600" cy="820" rx="60" ry="10"/>
    <ellipse cx="1900" cy="900" rx="80" ry="12"/>
    <ellipse cx="2150" cy="760" rx="50" ry="8"/>
  </g>
  <!-- the salt marsh, its edge running out onto the flat -->
  <path d="M-20 570 C 400 548 900 572 1300 590 C 1400 680 1330 860 1420 1020 L-20 1020 Z" fill="#b9ad62" stroke="none" data-shade="0.35"/>
  <path d="M-20 700 C 200 680 300 760 520 740 C 700 720 820 800 1000 780 C 1150 765 1250 820 1380 840" fill="none" stroke="#6f97a0" stroke-width="28" data-paint="wet"/>
  <g stroke="#6b6a2e" stroke-width="3" fill="none" data-line="pencil">
    <path d="M80 640 L90 600 M140 650 L150 610 M260 630 L268 590 M420 650 L430 612 M600 640 L610 600 M760 655 L770 615 M900 640 L910 602 M1080 650 L1090 612 M1220 660 L1230 620"/>
  </g>
  <!-- the dunes and the beach -->
  <path d="M2380 640 C 2440 540 2520 510 2600 548 C 2680 506 2770 526 2860 640 L2860 1020 L2380 1020 Z" fill="#e2d1a2" stroke="#2b231d" stroke-width="2.2" data-shade="0.3"/>
  <g stroke="#7b8a42" stroke-width="3" fill="none">
    <path d="M2460 572 L2450 532 M2480 568 L2492 526 M2600 548 L2590 508 M2620 552 L2634 506 M2760 566 L2752 526"/>
  </g>
  <path d="M2800 1020 L2800 660 C 2900 650 3060 662 3220 650 L3220 1020 Z" fill="#eadbb0" stroke="none" data-shade="0.2"/>
  <path d="M2830 700 C 2960 690 3080 706 3220 694" fill="none" stroke="#b9a77a" stroke-width="6" data-line="pencil"/>
  <!-- the tide over the mudflat, which the slider fills -->
  <g data-layer="tide">
    <path d="M1330 664 C 1500 684 1700 664 1900 684 C 2100 702 2300 672 2420 680 L2420 1000 L1330 1000 Z" fill="#aac5c7" stroke="none" data-paint="wet" data-shade="0"/>
  </g>
  <!-- the surf, which slides up the beach as the tide comes in -->
  <g data-layer="surf">
    <path d="M2840 660 C 2950 668 3080 656 3220 664 L3220 740 C 3120 760 3020 724 2930 744 C 2890 752 2860 730 2840 714 Z" fill="#9cc0c2" stroke="none" data-paint="wet" data-shade="0"/>
  </g>
  <!-- cordgrass in front of everything -->
  <g data-layer="grass" stroke="#5f6a26" stroke-width="5" fill="none">
    <path d="M20 1000 L40 920 M70 1000 L84 930 M120 1000 L118 915 M180 1000 L196 925 M240 1000 L236 918 M300 1000 L318 930 M380 1000 L374 920 M440 1000 L460 928 M520 1000 L512 916 M600 1000 L620 930 M680 1000 L672 920 M760 1000 L778 926 M840 1000 L832 918 M920 1000 L940 930 M1000 1000 L992 920 M1080 1000 L1098 928 M1160 1000 L1152 918 M1240 1000 L1260 930"/>
  </g>
</svg>
